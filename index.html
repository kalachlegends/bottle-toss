<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4d5a5f" />
    <title>Бутылки</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%2212%22 y=%222%22 width=%228%22 height=%225%22 rx=%221%22 fill=%22%23f0822a%22/%3E%3Cpath d=%22M13 7h6v5l4 4v12a2 2 0 0 1-2 2H11a2 2 0 0 1-2-2V16l4-4z%22 fill=%22%2386b83a%22/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #4d5a5f;
        --ink: rgba(245, 250, 248, 0.86);
        --btn: rgba(24, 30, 33, 0.32);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app,
      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      canvas {
        opacity: 0;
        transition: opacity 0.6s ease;
      }
      body.ready canvas {
        opacity: 1;
      }
      /* мягкая виньетка — фон спокойнее, центр композиции читается лучше */
      .vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(120% 95% at 50% 42%, rgba(0, 0, 0, 0) 55%, rgba(10, 14, 16, 0.38) 100%);
      }
      .mute {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        right: max(12px, env(safe-area-inset-right));
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: var(--btn);
        color: var(--ink);
        display: grid;
        place-items: center;
        padding: 0;
        cursor: pointer;
        -webkit-backdrop-filter: blur(6px);
        backdrop-filter: blur(6px);
        transition: background 0.2s ease, opacity 0.2s ease;
        z-index: 2;
      }
      .mute:hover {
        background: rgba(24, 30, 33, 0.5);
      }
      .mute.is-off {
        opacity: 0.6;
      }
      .mute:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      /* пока грузится физика и модели — тихий индикатор без текста */
      .loader {
        position: fixed;
        left: 50%;
        top: 50%;
        display: flex;
        gap: 8px;
        transform: translate(-50%, -50%);
        transition: opacity 0.4s ease;
      }
      .loader i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--ink);
        opacity: 0.25;
        animation: pulse 1.1s ease-in-out infinite;
      }
      .loader i:nth-child(2) {
        animation-delay: 0.15s;
      }
      .loader i:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes pulse {
        50% {
          opacity: 0.8;
          transform: translateY(-4px);
        }
      }
      body.ready .loader {
        opacity: 0;
        pointer-events: none;
      }
      #err {
        display: none;
        position: fixed;
        left: 16px;
        right: 16px;
        top: 40%;
        color: var(--ink);
        font: 600 15px/1.4 Manrope, system-ui, sans-serif;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="vignette"></div>
    <div class="loader" aria-hidden="true"><i></i><i></i><i></i></div>
    <div id="err"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
